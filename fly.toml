# fly.toml app configuration file generated for new-clean-studymatch on 2026-03-08T21:18:45+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "studymatch-api"  # or whatever your Fly.io app name is

[build]
  builder = "dockerfile"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
